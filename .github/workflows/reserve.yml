# This is a basic workflow that is manually triggered

name: auto_Reserve

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  schedule:
    # 注意：GitHub Actions cron 只能精确到“分钟”，且以 UTC 计时。
    # 若想在北京时间 15:00:03 左右开始抢座：建议提前几分钟启动，然后由 main.py 内部等待到 STARTTIME=15:00:03 再开始。
    - cron: "55 4 * * *" # 周一到周五：北京时间 14:55 触发（UTC 06:55）
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
  
      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11
      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          sudo apt-get install build-essential libssl-dev libffi-dev  python3-dev -y
          pip install cryptography requests opencv-python

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -m debug --action

